<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cybersecurity Portfolio & Labs</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

  <!-- Header / Navigation -->
  <header class="border-b border-gray-800 bg-gray-900/90 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight text-white">Cyber<span class="text-blue-500">Portfolio</span></h1>
      <button onclick="toggleAuthModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
        Account Access
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-16 text-center border-b border-gray-800 px-6">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight mb-4">
        Interactive Cloud & Cybersecurity Portfolio
      </h2>
      <p class="text-gray-400 text-lg mb-6">
        Hands-on security lab platform built on GitHub Pages and Supabase backend.
      </p>
    </div>
  </section>

  <!-- Interactive Labs Section -->
  <section id="labs-section" class="py-12 px-6 max-w-6xl mx-auto">
    <h2 class="text-3xl font-bold mb-2 text-white">Interactive Security Labs</h2>
    <p class="text-gray-400 mb-8">Test your technical skills, solve dynamic challenges, and capture flags to log progress.</p>
    
    <!-- Filter Controls -->
    <div class="flex gap-3 mb-6">
      <button onclick="filterLabs('All')" class="bg-blue-600 px-4 py-2 rounded-lg font-medium text-sm text-white hover:bg-blue-500">All Modules</button>
      <button onclick="filterLabs('Cloud Security')" class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-lg font-medium text-sm text-gray-300 hover:bg-gray-700">Cloud Security</button>
      <button onclick="filterLabs('Cybersecurity')" class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-lg font-medium text-sm text-gray-300 hover:bg-gray-700">Cybersecurity</button>
    </div>

    <!-- Dynamic Labs Grid -->
    <div id="labs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="text-gray-400 text-sm">Loading security labs...</div>
    </div>
  </section>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application JavaScript -->
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://oamprfzytergokcuwvkx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94bnZwc2Z6eXRrcmdva2N1d2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2OTI1NDksImV4cCI6MjEwNjI2ODU0OX0.AhzL3LgELbcK_qhnFlnNYWbaXdNUjVyX0-TGT-u9Ot8';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allLabs = [];
    let userCompletedLabs = new Set();

    async function loadLabsAndProgress() {
      try {
        const { data: { user } } = await supabase.auth.getUser();

        const { data: labs, error: labsErr } = await supabase
          .from('labs')
          .select('*');

        if (labsErr) throw labsErr;
        allLabs = labs || [];

        if (user) {
          const { data: progress } = await supabase
            .from('user_progress')
            .select('module_name')
            .eq('user_email', user.email);

          if (progress) {
            progress.forEach(item => userCompletedLabs.add(item.module_name));
          }
        }

        renderLabs(allLabs);
      } catch (err) {
        console.error('Error loading labs:', err.message);
      }
    }

    function renderLabs(labsToRender) {
      const container = document.getElementById('labs-grid');
      if (!container) return;
      container.innerHTML = '';

      if (labsToRender.length === 0) {
        container.innerHTML = `<p class="text-gray-400">No labs found.</p>`;
        return;
      }

      labsToRender.forEach(lab => {
        const isCompleted = userCompletedLabs.has(lab.id);

        const cardHtml = `
          <div class="bg-gray-800 rounded-xl p-6 border ${isCompleted ? 'border-green-500/50' : 'border-gray-700'} flex flex-col justify-between shadow-lg">
            <div>
              <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold px-2.5 py-1 rounded ${lab.category === 'Cloud Security' ? 'bg-indigo-900 text-indigo-300' : 'bg-red-900 text-red-300'}">${lab.category}</span>
                <span class="text-xs text-gray-400">${lab.difficulty} • ${lab.points} pts</span>
              </div>
              <h3 class="text-xl font-bold mb-2 text-white">${lab.title}</h3>
              <p class="text-gray-300 text-sm mb-4">${lab.description}</p>
              
              <details class="bg-gray-900/60 p-3 rounded text-xs font-mono text-gray-300 mb-4 cursor-pointer">
                <summary class="font-bold text-blue-400">View Lab Scenario & Logs</summary>
                <pre class="mt-2 whitespace-pre-wrap text-gray-300">${lab.scenario_details}</pre>
              </details>
            </div>

            <div>
              ${isCompleted ? `
                <div class="flex items-center text-green-400 font-semibold text-sm">
                  <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
                  Completed
                </div>
              ` : `
                <form onsubmit="submitFlag(event, '${lab.id}', '${lab.flag_hash}')" class="flex gap-2">
                  <input type="text" id="flag-input-${lab.id}" placeholder="WIZZY{...}" required class="bg-gray-900 border border-gray-700 text-white rounded px-3 py-2 text-sm flex-1 focus:outline-none focus:border-blue-500" />
                  <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded text-sm transition">Submit</button>
                </form>
              `}
              <div id="feedback-${lab.id}" class="mt-2 text-xs"></div>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      });
    }

    function filterLabs(category) {
      if (category === 'All') {
        renderLabs(allLabs);
      } else {
        renderLabs(allLabs.filter(l => l.category === category));
      }
    }

    async function submitFlag(event, labId, expectedFlag) {
      event.preventDefault();
      
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('Please sign in to submit flags and save your progress!');
        return;
      }

      const inputEl = document.getElementById(`flag-input-${labId}`);
      const feedbackEl = document.getElementById(`feedback-${labId}`);
      const submittedFlag = inputEl.value.trim();

      if (submittedFlag === expectedFlag) {
        feedbackEl.className = 'mt-2 text-xs text-green-400 font-semibold';
        feedbackEl.innerText = 'Correct flag! Saving progress...';

        const { error } = await supabase
          .from('user_progress')
          .insert([{
            user_email: user.email,
            module_name: labId,
            status: 'Completed'
          }]);

        if (!error) {
          userCompletedLabs.add(labId);
          setTimeout(() => renderLabs(allLabs), 1000);
        } else {
          feedbackEl.className = 'mt-2 text-xs text-yellow-400';
          feedbackEl.innerText = 'Flag correct! (Progress already logged)';
        }
      } else {
        feedbackEl.className = 'mt-2 text-xs text-red-400';
        feedbackEl.innerText = 'Incorrect flag. Inspect scenario details and try again!';
      }
    }

    document.addEventListener('DOMContentLoaded', loadLabsAndProgress);
  </script>
</body>
</html>
