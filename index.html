<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberAcademyX | Minimal Auth Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex items-center justify-center p-4">

  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 max-w-md w-full shadow-2xl">
    <div class="text-center mb-6">
      <div class="text-emerald-500 font-black text-3xl mb-1">⚡ CyberAcademyX</div>
      <p class="text-xs text-gray-400 font-mono">Authentication Testing Module</p>
    </div>

    <!-- Auth Mode Toggle -->
    <div class="flex border-b border-gray-800 mb-6">
      <button type="button" id="btn-tab-signup" class="flex-1 py-2 text-sm font-semibold text-emerald-400 border-b-2 border-emerald-500">Create Account</button>
      <button type="button" id="btn-tab-login" class="flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent">Sign In</button>
    </div>

    <!-- Input Form Area -->
    <div id="auth-form-area">
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email Address</label>
        <input type="email" id="email-input" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 font-mono" placeholder="test@example.com" />
      </div>

      <div class="mb-6">
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
        <input type="password" id="password-input" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 font-mono" placeholder="••••••••" />
      </div>

      <button type="button" id="action-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg text-sm transition">
        Create Account
      </button>
    </div>

    <!-- Status Message Box -->
    <div id="status-box" class="mt-4 p-3 rounded-lg text-xs font-mono hidden text-center"></div>

    <!-- Dashboard View (Shown after login) -->
    <div id="dash-area" class="hidden text-center py-4">
      <div class="inline-block bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full text-xs font-bold mb-3">
        ✓ Active User Session
      </div>
      <h3 class="text-lg font-bold text-white mb-1" id="dash-user-email"></h3>
      <p class="text-xs text-gray-400 mb-6">You are successfully authenticated with Supabase.</p>
      
      <button type="button" id="logout-btn" class="bg-red-950 hover:bg-red-900 text-red-300 border border-red-800 font-medium px-5 py-2 rounded-lg text-xs transition">
        Sign Out
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://oamprfzytergokcuwvkx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94bnZwc2Z6eXRrcmdva2N1d2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2OTI1NDksImV4cCI6MjEwNjI2ODU0OX0.AhzL3LgELbcK_qhnFlnNYWbaXdNUjVyX0-TGT-u9Ot8';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeTab = 'signup';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-tab-signup').addEventListener('click', () => setTab('signup'));
      document.getElementById('btn-tab-login').addEventListener('click', () => setTab('login'));
      document.getElementById('action-btn').addEventListener('click', executeAuth);
      document.getElementById('logout-btn').addEventListener('click', executeLogout);

      checkSession();
    });

    function setTab(tab) {
      activeTab = tab;
      const tabSignup = document.getElementById('btn-tab-signup');
      const tabLogin = document.getElementById('btn-tab-login');
      const actionBtn = document.getElementById('action-btn');
      hideStatus();

      if (tab === 'signup') {
        tabSignup.className = 'flex-1 py-2 text-sm font-semibold text-emerald-400 border-b-2 border-emerald-500';
        tabLogin.className = 'flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent';
        actionBtn.innerText = 'Create Account';
      } else {
        tabLogin.className = 'flex-1 py-2 text-sm font-semibold text-emerald-400 border-b-2 border-emerald-500';
        tabSignup.className = 'flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent';
        actionBtn.innerText = 'Sign In';
      }
    }

    function showStatus(msg, isError = false) {
      const box = document.getElementById('status-box');
      box.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border-red-800', 'bg-emerald-950/80', 'text-emerald-300', 'border-emerald-800');
      
      if (isError) {
        box.classList.add('bg-red-950/80', 'text-red-300', 'border', 'border-red-800');
      } else {
        box.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border', 'border-emerald-800');
      }
      box.innerText = msg;
    }

    function hideStatus() {
      document.getElementById('status-box').classList.add('hidden');
    }

    async function executeAuth() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showStatus('Please enter an email and password.', true);
        return;
      }

      showStatus(activeTab === 'signup' ? 'Creating account...' : 'Signing in...');

      try {
        if (activeTab === 'signup') {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;

          // If session is null, email confirmation is enabled in Supabase settings
          if (data.user && !data.session) {
            showStatus('Account registered! If confirmation is on, check email. Otherwise try signing in.', false);
          } else {
            showStatus('Account created and logged in!');
            await checkSession();
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showStatus('Successfully signed in!');
          await checkSession();
        }
      } catch (err) {
        showStatus(err.message || 'Authentication error', true);
      }
    }

    async function executeLogout() {
      await supabase.auth.signOut();
      hideStatus();
      await checkSession();
    }

    async function checkSession() {
      const { data: { user } } = await supabase.auth.getUser();
      const formArea = document.getElementById('auth-form-area');
      const dashArea = document.getElementById('dash-area');
      const tabSignup = document.getElementById('btn-tab-signup');
      const tabLogin = document.getElementById('btn-tab-login');

      if (user) {
        formArea.classList.add('hidden');
        tabSignup.classList.add('hidden');
        tabLogin.classList.add('hidden');
        dashArea.classList.remove('hidden');
        document.getElementById('dash-user-email').innerText = user.email;
      } else {
        formArea.classList.remove('hidden');
        tabSignup.classList.remove('hidden');
        tabLogin.classList.remove('hidden');
        dashArea.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
