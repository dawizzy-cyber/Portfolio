<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizzy Cyber | Interactive Cloud & Security Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
            accent: '#10b981',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white min-h-screen flex flex-col">

  <!-- Main Top Header Bar -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-950/80 border-b border-slate-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
      
      <!-- Left: Logo & Drawer Menu Button -->
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle-btn" onclick="toggleSidebarMenu()" class="p-2 text-slate-400 hover:text-white bg-slate-900 border border-slate-800 rounded-lg transition" title="Toggle Navigation Drawer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        
        <a href="javascript:void(0)" onclick="switchView('home')" class="text-lg sm:text-xl font-bold tracking-tight text-blue-500 font-mono flex items-center gap-2">
          &lt;WizzyCyber /&gt;
        </a>
      </div>

      <!-- Center: Navigation Tabs (Desktop) -->
      <nav id="desktop-top-nav" class="hidden md:flex items-center space-x-1 text-xs font-mono font-medium text-slate-400">
        <button onclick="switchView('home')" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-slate-900 transition">🔥 Home</button>
        <button onclick="switchView('study')" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-slate-900 transition">💎 Study</button>
        <button onclick="switchView('dashboard')" class="px-3 py-1.5 rounded-lg hover:text-white hover:bg-slate-900 transition">📊 Dashboard</button>
      </nav>

      <!-- Right Side: Profile / Auth Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Auth Container (Populated dynamically) -->
        <div id="auth-container" class="flex items-center gap-2">
          <button onclick="openAuthModal()" id="auth-btn" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition">
            Sign In / Register
          </button>
        </div>

        <!-- Follow Badge -->
        <a href="https://x.com/intent/follow?screen_name=bush_bean__" target="_blank" rel="noopener noreferrer" class="px-3 py-2 bg-blue-600/10 border border-blue-500/30 text-blue-400 text-xs font-semibold rounded-lg hover:bg-blue-600 hover:text-white transition hidden sm:flex items-center gap-2">
          + Follow @bush_bean__
        </a>
      </div>

    </div>
  </header>

  <!-- Sliding Drawer Navigation Menu -->
  <aside id="sidebar-drawer" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-950 border-r border-slate-900 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between p-6 shadow-2xl">
    <div>
      <div class="flex justify-between items-center mb-8 border-b border-slate-900 pb-4">
        <span class="text-base font-bold text-blue-500 font-mono">&lt;WizzyCyber /&gt;</span>
        <button onclick="toggleSidebarMenu()" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>

      <p class="text-[10px] uppercase font-mono tracking-wider text-slate-500 mb-3">Navigation Menu</p>
      
      <div class="space-y-1.5 text-xs font-mono">
        <button onclick="switchView('home'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>🏠</span> Home Platform
        </button>
        <button onclick="switchView('dashboard'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>📊</span> Student Dashboard
        </button>
        <button onclick="switchView('exam-history'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>📜</span> Exam History
        </button>
        <button onclick="switchView('performance'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>📈</span> Performance
        </button>
        <button onclick="switchView('video-lessons'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>🎥</span> Video Lessons
        </button>
        <button onclick="switchView('bookmark'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>🔖</span> Bookmarks
        </button>
        <button onclick="switchView('settings'); toggleSidebarMenu();" class="w-full text-left px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-900 hover:text-blue-400 transition flex items-center gap-2">
          <span>⚙️</span> Profile & Settings
        </button>
      </div>
    </div>

    <div class="pt-4 border-t border-slate-900 space-y-2">
      <button onclick="switchView('contact'); toggleSidebarMenu();" class="w-full text-left text-xs font-mono text-slate-400 hover:text-white py-1">📞 Contact Support</button>
      <button onclick="switchView('help'); toggleSidebarMenu();" class="w-full text-left text-xs font-mono text-slate-400 hover:text-white py-1">❓ Help Desk</button>
      <button id="sidebar-logout-btn" onclick="handleSignOut(); toggleSidebarMenu();" class="w-full text-left text-xs font-mono text-red-400 hover:text-red-300 py-2 border-t border-slate-900/80 mt-2 hidden">
        🚪 Sign Out <span id="sidebar-logout-user"></span>
      </button>
    </div>
  </aside>

  <!-- App Main Content Container -->
  <main id="app-container" class="flex-grow">
